<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Inscrição</title>
</head>
<body>

    <header>
        <h1>Meu Blog</h1>
        <nav>
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#artigos">Artigos</a></li>
                <li><a href="#contato">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h2>Primeiro Artigo</h2>
            <p>Conteúdo descritivo do primeiro artigo publicado no blog.</p>
            <img src="exemplo1.jpg" alt="Imagem ilustrativa do primeiro artigo">
        </article>

        <article>
            <h2>Segundo Artigo</h2>
            <p>Conteúdo descritivo do segundo artigo publicado no blog.</p>
            <img src="exemplo2.jpg" alt="Imagem ilustrativa do segundo artigo">
        </article>
    </main>

    <aside>
        <form method="get">
            <h2>Formulário de Inscrição</h2>

            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" minlength="3" required>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="18" max="120" required>
            </div>

            <div>
                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione...</option>
                    <option value="tecnologia">Tecnologia</option>
                    <option value="programacao">Programação</option>
                    <option value="web">Web Design</option>
                </select>
            </div>

            <div>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Aceito os termos</label>
            </div>

            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </aside>

    <footer>
        <p>&copy; 2026 Meu Blog. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
